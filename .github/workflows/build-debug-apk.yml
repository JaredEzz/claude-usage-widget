name: Build debug APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          # Fixed key (not content-hashed) -- created once, reused by every run after, so debug
          # builds keep a stable signature and `adb install -r` can update in place instead of
          # requiring an uninstall (which would wipe the app's WebView cookies / accounts).
          key: debug-keystore-v1

      - name: Ensure debug signing key exists
        # AGP auto-generates ~/.android/debug.keystore on first use, but only mid-build -- by then
        # it's too late for the cache step above (which snapshots its path at end-of-job) to have
        # ever seen it get created on a cache-miss run, so it silently never saved. Generate it
        # ourselves up front (matching AGP's own default debug key spec) so the path is always
        # populated before the cache-save phase runs, on both cache-hit and cache-miss runs.
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
